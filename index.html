<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>С 11-летием! ♡ Твой подарок</title>
    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(145deg, #fff9f5 0%, #ffe6f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Декоративные круги и волны */
        .deco-circle {
            position: fixed;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,200,220,0.3) 0%, rgba(255,180,200,0) 70%);
            z-index: 0;
            pointer-events: none;
        }

        .circle1 {
            width: 400px;
            height: 400px;
            top: -150px;
            left: -150px;
        }
        .circle2 {
            width: 500px;
            height: 500px;
            bottom: -200px;
            right: -200px;
            background: radial-gradient(circle, rgba(200,220,255,0.25) 0%, rgba(200,220,255,0) 70%);
        }
        .circle3 {
            width: 250px;
            height: 250px;
            top: 40%;
            left: 80%;
            background: radial-gradient(circle, rgba(255,230,180,0.4) 0%, rgba(255,230,180,0) 70%);
        }

        /* Плавающие сердечки */
        .floating-heart {
            position: fixed;
            font-size: 1.8rem;
            opacity: 0.5;
            pointer-events: none;
            z-index: 1;
            animation: float 10s infinite ease-in-out;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(6deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        /* Главная карточка */
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 72px 48px 72px 48px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.1), 0 0 0 1px rgba(255,255,240,0.6);
            max-width: 700px;
            width: 100%;
            padding: 2rem 2rem 3rem;
            text-align: center;
            position: relative;
            z-index: 10;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: scale(1.01);
        }

        /* Иконки и украшения */
        .crown-icon {
            font-size: 3.6rem;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.1));
            margin-bottom: 0.5rem;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #FF8CA3, #FF6A88, #FFB347);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 0.5rem 0;
            letter-spacing: -0.5px;
        }

        .age {
            font-size: 3.2rem;
            font-weight: 800;
            display: inline-block;
            background: white;
            padding: 0.2rem 1.2rem;
            border-radius: 100px;
            box-shadow: 0 6px 14px rgba(255, 100, 120, 0.2);
            margin: 0.75rem 0;
            color: #FF6A88;
        }

        .greeting-text {
            font-size: 1.4rem;
            font-weight: 500;
            color: #7A5C6E;
            margin: 1rem 0 1.5rem;
            line-height: 1.4;
        }

        .gift-box {
            background: #FFF2F5;
            border-radius: 56px;
            padding: 1.2rem;
            margin: 2rem 0 1.5rem;
            display: inline-block;
            width: auto;
        }

        .gift-icon {
            font-size: 3rem;
            animation: bounce 1.5s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .btn-podarok {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background: linear-gradient(105deg, #FF9EB5 0%, #FF6A88 100%);
            color: white;
            font-size: 1.6rem;
            font-weight: 700;
            font-family: 'Quicksand', sans-serif;
            padding: 1rem 2.5rem;
            border-radius: 60px;
            text-decoration: none;
            box-shadow: 0 12px 20px rgba(255, 90, 120, 0.4);
            transition: all 0.25s ease;
            border: none;
            cursor: pointer;
            margin-top: 0.5rem;
            letter-spacing: 0.5px;
        }

        .btn-podarok i {
            font-size: 1.7rem;
            transition: transform 0.2s;
        }

        .btn-podarok:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 28px rgba(255, 90, 120, 0.5);
            background: linear-gradient(105deg, #FF8CA8, #FF5A7C);
        }

        .btn-podarok:active {
            transform: translateY(2px);
        }

        .small-note {
            margin-top: 2rem;
            font-size: 0.9rem;
            color: #AA8C9A;
            background: rgba(255,245,245,0.7);
            display: inline-block;
            padding: 0.4rem 1rem;
            border-radius: 50px;
            backdrop-filter: blur(4px);
        }

        .small-note i {
            margin-right: 6px;
        }

        /* Адаптивность */
        @media (max-width: 550px) {
            .card {
                padding: 1.8rem 1.2rem 2.2rem;
            }
            h1 {
                font-size: 2.1rem;
            }
            .age {
                font-size: 2.4rem;
            }
            .greeting-text {
                font-size: 1.1rem;
            }
            .btn-podarok {
                font-size: 1.3rem;
                padding: 0.8rem 1.8rem;
            }
            .crown-icon {
                font-size: 2.8rem;
            }
        }
    </style>
</head>
<body>

<!-- Декоративные элементы -->
<div class="deco-circle circle1"></div>
<div class="deco-circle circle2"></div>
<div class="deco-circle circle3"></div>

<!-- Плавающие сердечки (чисто украшения) -->
<div class="floating-heart" style="top: 12%; left: 5%; animation-duration: 14s;">❤️</div>
<div class="floating-heart" style="top: 75%; left: 88%; animation-duration: 12s; animation-delay: -2s;">🌸</div>
<div class="floating-heart" style="top: 20%; left: 92%; animation-duration: 11s; font-size: 2rem;">✨</div>
<div class="floating-heart" style="top: 85%; left: 7%; animation-duration: 16s; animation-delay: -4s;">🎀</div>
<div class="floating-heart" style="top: 45%; left: 2%; animation-duration: 18s;">🦄</div>

<div class="card">
    <div class="crown-icon">👑🎂</div>
    <h1>С днём рождения,</h1>
    <h1>наша звёздочка!</h1>
    <div class="age">11 лет 💖</div>
    <div class="greeting-text">
        🌸 Ты становишься ещё ярче, смелее и прекраснее!<br>
        Пусть каждый день дарит улыбки, волшебство и радость! 🎈
    </div>

    <div class="gift-box">
        <div class="gift-icon">🎁✨</div>
    </div>

    <!-- Кнопка с подарком — скачивание Android приложения -->
    <a href="/app-release.apk" class="btn-podarok" download="app-release.apk">
        <i class="fas fa-download"></i> Скачать твой подарок!
        <i class="fas fa-gift"></i>
    </a>

    <div class="small-note">
        <i class="fab fa-android"></i> Android‑приложение — специально для тебя!
    </div>
    <div class="small-note" style="margin-top: 0.6rem; background: transparent;">
        🌷 Нажми на кнопку, чтобы получить подарок
    </div>
</div>

<!-- Небольшой скрипт для конфетти при клике (радость) -->
<script>
    (function() {
        // Эффект "конфетти" по клику на кнопку подарка — весёлый сюрприз
        const btn = document.querySelector('.btn-podarok');
        if (btn) {
            btn.addEventListener('click', function(e) {
                // просто добавим немного конфетти, если нужно
                // используем простую библиотеку конфетти, но мы сделаем лёгкую самоделку
                for (let i = 0; i < 60; i++) {
                    createConfettiPiece();
                }
            });
        }

        function createConfettiPiece() {
            const colors = ['#FFB7C5', '#FF8CA3', '#FFD966', '#B5E3FF', '#D9A7F5', '#A2E3C4'];
            const conf = document.createElement('div');
            conf.style.position = 'fixed';
            conf.style.width = '10px';
            conf.style.height = '10px';
            conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            conf.style.borderRadius = Math.random() > 0.6 ? '50%' : '2px';
            conf.style.left = Math.random() * window.innerWidth + 'px';
            conf.style.top = '-20px';
            conf.style.zIndex = '9999';
            conf.style.pointerEvents = 'none';
            conf.style.opacity = '0.9';
            document.body.appendChild(conf);

            let posY = -20;
            const speed = 2 + Math.random() * 3;
            const drift = (Math.random() - 0.5) * 1.2;
            let xPos = parseFloat(conf.style.left);

            function fall() {
                posY += speed;
                xPos += drift;
                conf.style.top = posY + 'px';
                conf.style.left = xPos + 'px';
                if (posY < window.innerHeight + 50) {
                    requestAnimationFrame(fall);
                } else {
                    conf.remove();
                }
            }
            requestAnimationFrame(fall);

            setTimeout(() => {
                if (conf.parentNode) conf.remove();
            }, 4000);
        }
    })();
</script>
</body>
</html>
